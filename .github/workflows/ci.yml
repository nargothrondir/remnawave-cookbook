---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, so a version bump in the reference implementation is noticed even
  # when nothing is pushed here.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  tells-guard:
    name: tells-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # FORBIDDEN_STRINGS is a repository secret (one per line or comma-separated). Secrets
      # are not passed to workflows triggered from forks, so a fork PR runs
      # checks [1] and [2] only and says so; pushes to this repository require
      # the secret, so a missing one fails instead of passing quietly.
      - name: Run the guard
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
          REQUIRE_FORBIDDEN_STRINGS: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bash tools/tells-guard.sh

  validate:
    name: validate.py tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # One test per rule: a rule that stops biting fails here.
      - name: Run the tests
        run: python -m unittest discover -s tests -v

      # The shipped example must stay valid (placeholders are notes, not errors).
      - name: Validate the shipped example
        run: python skills/remnawave-cookbook/validate.py skills/remnawave-cookbook/examples/profile.json

  entrypoints:
    name: entry points and bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check that every entry point reaches every page
        run: bash tools/check-entrypoints.sh

      - name: Build the ChatGPT bundle
        run: bash tools/build-chatgpt-bundle.sh

      - name: Attach the bundle to this run
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-bundle
          path: dist/remnawave-cookbook.md

  versions:
    name: documented versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Facts are pinned to versions; a pin that moved means facts to re-verify.
      - name: Compare SKILL.md with the reference implementation's pins
        run: bash tools/check-versions.sh

  scripts:
    name: plugin scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # bin/ is on the Bash tool's PATH while the plugin is enabled, so every
      # script there is code other people run: it must lint clean.
      - name: shellcheck the plugin's bin/
        run: shellcheck bin/edge-check

      - name: edge-check prints its usage
        run: bash bin/edge-check --help

      # The authoritative manifest check, from Claude Code itself.
      - name: claude plugin validate
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json
          npx -y @anthropic-ai/claude-code plugin validate .

      # The runner has PowerShell 7; parse errors fail the job without
      # running the probe (it needs a live Mihomo controller).
      - name: mihomo-probe.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("bin/mihomo-probe.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Output "mihomo-probe.ps1: no parse errors"
