# Server blocks for the decoy site and the xHTTP hop, as a gomplate template
# for the Angie -templated image. NODE_NAME, ACME_DOMAIN, XHTTP_PATH and
# XHTTP_UPSTREAM come from the container environment.

server {
    server_name {{ .Env.NODE_NAME }}.{{ .Env.ACME_DOMAIN }};   # = REALITY serverNames
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    acme letsencrypt;                                          # Angie native ACME (DNS-01 hook elsewhere)
    ssl_certificate $acme_cert_letsencrypt;
    ssl_certificate_key $acme_cert_key_letsencrypt;

    root /var/www/html;
    index index.html;
{{- if getenv "XHTTP_PATH" }}
{{- $upstream := getenv "XHTTP_UPSTREAM" "grpc" }}
{{- if not (or (eq $upstream "grpc") (eq $upstream "http")) }}
{{- test.Fail (printf "XHTTP_UPSTREAM must be grpc or http, got %q" $upstream) }}
{{- end }}
    location {{ getenv "XHTTP_PATH" }} {
        access_log off;
        client_max_body_size 0;
        client_body_timeout 5m;
{{- if eq $upstream "http" }}
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_pass http://unix:/dev/shm/xhttp.sock;
{{- else }}
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        grpc_set_header X-Real-IP $proxy_protocol_addr;
        grpc_set_header X-Forwarded-For $proxy_protocol_addr;
        grpc_pass unix:/dev/shm/xhttp.sock;
{{- end }}
    }
{{- end }}
}

server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol default_server;
    server_name _;
    ssl_reject_handshake on;
}
